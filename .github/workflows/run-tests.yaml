name: Run tests on push to main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1 # 2026.2.1

      - name: Install Go dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Static analysis
        run: make check
